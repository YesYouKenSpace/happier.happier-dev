# Keep GitHub Actions pinned by SHA fresh with automated update PRs.
# Actions are pinned to full commit SHAs (see .github/workflows/**, .github/actions/**);
# Dependabot bumps the SHA and the trailing `# vX` version comment together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Scans .github/workflows/**. Composite actions under .github/actions/** may not be
    # auto-tracked; those pins (create-github-app-token, setup-xcode) can need manual bumps.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch action bumps into one PR to reduce review noise.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
